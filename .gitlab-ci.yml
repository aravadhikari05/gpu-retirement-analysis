image: gcr.io/kaniko-project/executor:debug

stages:
- build-and-push

build-and-push-job:
  stage: build-and-push
  variables:
    GODEBUG: "http2client=0"
  # Only build when something that lands in the image actually changed. This
  # mirrors the path filter already present in .github/workflows/docker.yml,
  # which had it while this job, the one that builds the image the pods really
  # run, did not.
  #
  # Without this the job fires on every push to every branch. At 7.71 GB and a
  # 16 minute push that means docs, task specs, CSVs and paper notes each cost
  # a multi-GB push to the shared NRP registry, which is the pressure that
  # stalled it during pipeline 86061.
  #
  # Consequence to know about: a commit touching only docs now produces no
  # SHA-tagged image. That is intended. Pods pin by digest, so nothing breaks,
  # but do not assume every commit has a corresponding tag in the registry.
  rules:
  - changes:
    - Dockerfile
    - requirements.txt
    - benchmarks/**/*
    - measurement/**/*
    when: on_success
  # Escape hatch for a rebuild with no source change, for example when a base
  # image moves underneath us. allow_failure keeps an unclicked manual job from
  # blocking the pipeline.
  - when: manual
    allow_failure: true
  script:
  - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
  # Every branch gets a SHA-tagged image, which is what the benchmark pods pin
  # to. Only the default branch also moves :latest, so a feature branch build
  # cannot silently become the image everyone else pulls.
  #
  # Note CI_COMMIT_SHORT_SHA is 8 characters here, not the 7 that git rev-parse
  # --short gives by default. Read the tag off the registry, do not derive it.
  - |
    DESTINATIONS="--destination $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    if [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then
      DESTINATIONS="$DESTINATIONS --destination $CI_REGISTRY_IMAGE:latest"
    fi
    echo "building for ref '$CI_COMMIT_REF_NAME' (default '$CI_DEFAULT_BRANCH')"
    echo "destinations: $DESTINATIONS"
    # cache=false: pipeline 86061 applied every layer and finished its cache
    # push at INFO[0577], then produced no further output for 20+ minutes and
    # had to be force-cancelled. With caching on, kaniko pushes the whole image
    # twice, once to the cache repo and once to the tag. Halving the pushed
    # bytes costs us fast rebuilds and buys a build that terminates.
    #
    # compressed-caching=false cuts kaniko's peak memory on large images, which
    # matters here because the CUDA plus torch layers are multi-GB.
    /kaniko/executor --cache=false --compressed-caching=false --push-retry=10 \
      --context "$CI_PROJECT_DIR" \
      --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
      $DESTINATIONS
