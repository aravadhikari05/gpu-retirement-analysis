name: Build and Push Container

on:
  push:
    # schema-idle-sizing is listed so the enforced WorkloadResult, the idle
    # power path and the new sizing defaults can be smoke tested on a GPU
    # before they merge. None of that code has ever executed. Remove the
    # branch once it lands.
    branches: [main, schema-idle-sizing]
    paths:
      - "Dockerfile"
      - "benchmarks/**"
      - "measurement/**"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # :latest ONLY from the default branch. k8s/interactive.yaml and
          # k8s/sample_job.yaml pull :latest, so a feature branch build moving
          # it would change the image everyone else runs, underneath them.
          # CLAUDE.md asserted that could not happen. That was true of the
          # GitLab CI, not of this workflow, which tagged :latest
          # unconditionally and was safe only because it never ran off main.
          tags: |
            ghcr.io/aravadhikari05/gpu-retirement-analysis:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/aravadhikari05/gpu-retirement-analysis:latest' || '' }}
