# Throwaway CPU pod that mounts the results PVC so finished runs can be copied
# off it. Owner: Arav. No GPU. A completed benchmark pod cannot be exec'd into,
# and the PVC is the only copy of a run until it is pulled into data/raw/.
#
# Delete when done. busybox has tar, which `kubectl cp` requires.
apiVersion: v1
kind: Pod
metadata:
  name: arav-pvc-shell
  namespace: cmpm118
  labels:
    app: gpu-retirement
    gpu-retirement/role: pvc-shell
spec:
  restartPolicy: Never
  containers:
  - name: shell
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
    resources:
      limits: {memory: 512Mi, cpu: "1"}
      requests: {memory: 512Mi, cpu: "1"}
    volumeMounts:
    - name: results
      mountPath: /results
  volumes:
  - name: results
    persistentVolumeClaim:
      claimName: matmul-results
