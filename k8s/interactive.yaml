apiVersion: v1
kind: Pod
metadata:
  name: interactive-pod-aidan
spec:
  containers:
  - name: interactive-pod-aidan
    image: gitlab-registry.nrp-nautilus.io/aidan/aidan:latest
    command: ["sleep", "36500000"]
    env:
      - name: FILE_NAME
        value: "tmp.db"
      - name: THREAD_COUNT
        value: "10"
    resources:
      limits:
        cpu: 5
        memory: 4Gi
      requests:
        cpu: 5
        memory: 4Gi
    volumeMounts:
    - mountPath: /sample-pvc-aidan
      name: sample-pvc-aidan
  restartPolicy: Never
  volumes:
    - name: sample-pvc-aidan
      persistentVolumeClaim:
        claimName: sample-pvc-aidan