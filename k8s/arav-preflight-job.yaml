# Per-GPU preflight check. Run once per GPU model before trusting its data.
#
# Render with envsubst, requires: IMAGE, GPU_SLUG, GPU_PRODUCT, POWER_SECONDS
#
# Answers on real hardware what CLAUDE.md currently records as unverified:
# whether this torch build carries the card's sm_XX, whether NVML resolves the
# energy counter, and at what granularity the card reports wattage.
#
# The ConfigMap that used to supply preflight.py is gone, as that comment said
# to do once the file was committed and built in. It is in the image now:
# Dockerfile line 29 copies measurement/ wholesale, and the digest below is
# built from a commit that contains preflight.py. Output goes to stdout as a
# PREFLIGHT_JSON line, so no PVC is needed; capture it from the pod log.
#
# POWER_SECONDS: use 60, not the 20 this file first used. The 30 s floor exists
# because a short sampling window makes the integral untrustworthy, and the
# counter-against-integral comparison is one of the things preflight reports.
# Comparing them over a 20 s window measures the floor, not the card.
#
# Conventions copied from k8s/aidan-llm-smoke-job.yaml, which worked:
#   backoffLimit 0        a retry could land on a different card
#   ttlSecondsAfterFinished  server-side cleanup, survives the VPN dropping
#   activeDeadlineSeconds    frees the GPU regardless of what any client does
#   no priorityClassName     high-priority-ban and low-priority-ban in cmpm118
#                            are both pods=0; unset matches neither selector
#
# NAMING. CLAUDE.md says to prefix every resource with `aidan`. That rule reads
# as written for a single deployer: Aidan uses `aidan-`, Veda used a `-veda`
# suffix, and this uses `arav-`. The intent is per-person namespacing in a
# shared namespace. Worth restating the rule as "prefix with your own name".
apiVersion: batch/v1
kind: Job
metadata:
  name: arav-preflight-${GPU_SLUG}
  namespace: cmpm118
  labels:
    app: arav-preflight
    aidan.ucsc.edu/owner: arav
    aidan.ucsc.edu/gpu-slug: "${GPU_SLUG}"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: arav-preflight
        aidan.ucsc.edu/owner: arav
        aidan.ucsc.edu/gpu-slug: "${GPU_SLUG}"
    spec:
      restartPolicy: Never
      nodeSelector:
        nvidia.com/gpu.product: "${GPU_PRODUCT}"
      containers:
      - name: preflight
        image: ${IMAGE}
        # Overrides the image ENTRYPOINT, which is measurement/runner.py.
        command:
        - python3
        - -m
        - measurement.preflight
        - --power-seconds=${POWER_SECONDS}
        env:
        # Downward API rather than the census. CLAUDE.md requires the node be
        # observed at runtime, and kubectl get node <name> is Forbidden for us.
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            nvidia.com/gpu: 1
            cpu: "2"
            memory: 8Gi
            ephemeral-storage: 16Gi
          limits:
            nvidia.com/gpu: 1
            cpu: "2"
            memory: 8Gi
            ephemeral-storage: 16Gi
